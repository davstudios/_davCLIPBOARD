[package]
name = "davclipboard"
version = "26.9.1"
description = "_davCLIPBOARD — local clipboard history manager for Windows, macOS and Linux by _davstudios."
authors = ["_davstudios"]
license = "MIT"
homepage = "https://davstudios.it"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "davclipboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-ico"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
